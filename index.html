<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111114"><title>MovieFinder · 发现值得看的影视</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="masthead"><a class="brand" href="./">MOVIE<span>FINDER</span><span class="brand-dot">●</span></a><span class="tagline">好故事，值得被发现</span></header>
<main>
<section class="intro"><p class="eyebrow">YOUR NEXT GREAT STORY</p><h1>下一部，<span>看什么？</span></h1><p class="intro-copy">从经典到未知，找到值得花时间的电影与剧集。</p></section>
<form id="search" role="search"><label class="sr-only" for="query">影视名称</label><span aria-hidden="true" class="search-icon">⌕</span><input id="query" type="search" placeholder="搜索电影或剧集，中文 / English" maxlength="120" autocomplete="off"><button class="primary" type="submit">搜索</button></form>
<nav id="categories" aria-label="影视分类"><button data-category="war">战争</button><button data-category="scifi">科幻</button><button data-category="action">动作</button><button data-category="top" aria-pressed="true">最高评分</button><button data-category="american">美剧</button><button data-category="british">英剧</button></nav>
<section class="listing" aria-labelledby="list-title"><div class="list-heading"><div><p class="eyebrow" id="list-kicker">THE BEST OF CINEMA</p><h2 id="list-title">最高评分</h2></div><div id="types" class="segmented" aria-label="作品类型"><button data-type="movie" aria-pressed="true">电影</button><button data-type="tv" aria-pressed="false">剧集</button></div></div><p id="list-note" class="muted"></p><div id="status" role="status" aria-live="polite"></div><div id="grid" class="grid"></div><div class="load-row"><button id="more" class="secondary" hidden>加载更多</button></div></section>
</main>
<footer><span>MovieFinder · 只为发现好故事</span><span>数据来自 TMDB / OMDb · 评分随来源更新</span><p>This product uses the TMDB API but is not endorsed or certified by TMDB. <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a></p></footer>
<dialog id="detail" aria-labelledby="detail-title"><button id="close-detail" class="close" aria-label="关闭详情">×</button><div id="detail-content"></div></dialog>
<script type="module" src="./app.js"></script>
</body></html>
